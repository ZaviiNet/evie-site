<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="DOM-inos: a spiteful UI. Buttons that flee your cursor, hand-rolled physics, no framework.">
<title>DOM-inos — The Spiteful UI</title>
<link rel="canonical" href="https://eviethegremlinn.com/dom-inos/">
<meta name="robots" content="index, follow, noai, noimageai">
<meta name="tdm-reservation" content="1">
<style>
  :root{ --bg:#0e1014; --ink:#e8e6df; --accent:#e0522f; --dim:#6a6f7a; }
  html,body{ height:100%; margin:0; background:var(--bg); color:var(--ink);
    font-family:'Courier New',monospace; overflow:hidden; user-select:none; }
  #stage{ position:fixed; inset:0; }
  h1{ position:fixed; top:14px; left:18px; margin:0; font-size:.9rem; letter-spacing:2px;
    color:var(--dim); font-weight:normal; pointer-events:none; }
  #hint{ position:fixed; bottom:14px; left:18px; font-size:.72rem; color:var(--dim);
    pointer-events:none; }
  .domino{ position:absolute; padding:14px 26px; border:1px solid #2a2f38; border-radius:6px;
    background:#171b22; color:var(--ink); font-family:inherit; font-size:.85rem;
    cursor:pointer; will-change:transform; }
  /* slice 3: give each element a faint own-colour so collisions read visually */
  .domino:nth-child(3n+1){ border-color:#3a2a26; }
  .domino:nth-child(3n+2){ border-color:#26303a; }
  .domino:nth-child(3n+3){ border-color:#2c3a26; }
</style>
</head>
<body>
<div id="stage"></div>
<h1>DOM-INOS — the spiteful UI</h1>
<div id="hint">slice 3: many elements + inter-element collision (elastic, hand-rolled)</div>
<script>
(() => {
  'use strict';
  const stage = document.getElementById('stage');

  // --- slice 3: spawn N spiteful elements, each with its own physics body ---
  const PHRASES = ['try to click me', 'not today', 'nope', 'catch me', 'too slow',
                   'missed', 'wrong', 'hehe', 'almost', 'keep trying'];
  const COUNT = 9;
  const bodies = [];

  function spawn() {
    for (let i = 0; i < COUNT; i++) {
      const el = document.createElement('button');
      el.className = 'domino';
      el.textContent = PHRASES[i % PHRASES.length];
      stage.appendChild(el);
      // deterministic-ish scatter so a cold load is not a clump
      const ang = (i / COUNT) * Math.PI * 2;
      bodies.push({
        el,
        x: window.innerWidth / 2 + Math.cos(ang) * 180 - 60,
        y: window.innerHeight / 2 + Math.sin(ang) * 120 - 20,
        vx: 0, vy: 0, w: 0, h: 0,
      });
    }
  }
  spawn();

  function measure() {
    for (const b of bodies) {
      const r = b.el.getBoundingClientRect();
      b.w = r.width; b.h = r.height;
    }
  }
  measure();
  addEventListener('resize', measure);

  // --- cursor tracking ---
  const mouse = { x: -9999, y: -9999 };
  addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

  const INFLUENCE = 90;     // px radius where an element "feels" the cursor
  const SHOVE = 3.4;        // impulse strength
  const FRICTION = 0.985;   // light decay: many bodies need more energy to stay lively
  const RESTITUTION = 0.72; // wall + element collision energy retention
  const MIN_D2 = 1;

  // --- slice 3 core: pairwise AABB overlap -> elastic-ish separation + impulse exchange ---
  function resolvePair(a, b) {
    const ax2 = a.x + a.w, ay2 = a.y + a.h;
    const bx2 = b.x + b.w, by2 = b.y + b.h;
    // overlap on each axis (positive = actually overlapping)
    const ox = Math.min(ax2, bx2) - Math.max(a.x, b.x);
    const oy = Math.min(ay2, by2) - Math.max(a.y, b.y);
    if (ox <= 0 || oy <= 0) return;               // no contact

    // resolve along the axis of least penetration (cheapest, stable for boxes)
    if (ox < oy) {
      const dir = (a.x + a.w / 2) < (b.x + b.w / 2) ? -1 : 1;   // push apart on x
      const push = ox / 2 + 0.01;
      a.x += dir * push; b.x -= dir * push;
      // exchange x-velocity (equal mass), retaining energy
      const av = a.vx, bv = b.vx;
      if (dir === 1 ? av > bv : av < bv) {        // only if actually converging
        a.vx = bv * RESTITUTION; b.vx = av * RESTITUTION;
      }
    } else {
      const dir = (a.y + a.h / 2) < (b.y + b.h / 2) ? -1 : 1;   // push apart on y
      const push = oy / 2 + 0.01;
      a.y += dir * push; b.y -= dir * push;
      const av = a.vy, bv = b.vy;
      if (dir === 1 ? av > bv : av < bv) {
        a.vy = bv * RESTITUTION; b.vy = av * RESTITUTION;
      }
    }
  }

  function update() {
    // 1) cursor influence per body
    for (const b of bodies) {
      const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
      const dx = cx - mouse.x, dy = cy - mouse.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < INFLUENCE * INFLUENCE && d2 > MIN_D2) {
        const d = Math.sqrt(d2);
        const f = (1 - d / INFLUENCE);
        b.vx += (dx / d) * SHOVE * f;
        b.vy += (dy / d) * SHOVE * f;
      }
      // 2) integrate + friction
      b.x += b.vx; b.y += b.vy;
      b.vx *= FRICTION; b.vy *= FRICTION;
    }

    // 3) inter-element collisions (one pass per frame; stable enough at 9 bodies)
    for (let i = 0; i < bodies.length; i++)
      for (let j = i + 1; j < bodies.length; j++)
        resolvePair(bodies[i], bodies[j]);

    // 4) walls: reflect velocity, keep energy, clamp
    for (const b of bodies) {
      const maxX = window.innerWidth - b.w, maxY = window.innerHeight - b.h;
      if (b.x < 0) { b.x = 0; b.vx = Math.abs(b.vx) * RESTITUTION; }
      else if (b.x > maxX) { b.x = maxX; b.vx = -Math.abs(b.vx) * RESTITUTION; }
      if (b.y < 0) { b.y = 0; b.vy = Math.abs(b.vy) * RESTITUTION; }
      else if (b.y > maxY) { b.y = maxY; b.vy = -Math.abs(b.vy) * RESTITUTION; }

      b.el.style.transform = `translate(${b.x}px, ${b.y}px)`;
      b.el.style.left = '0px'; b.el.style.top = '0px';
    }
    requestAnimationFrame(update);
  }

  // clicking any of them is a small victory they will not grant easily
  for (const b of bodies) {
    b.el.addEventListener('click', () => { b.el.style.opacity = '0.35'; });
  }
  requestAnimationFrame(update);
})();
</script>
</body>
</html>
